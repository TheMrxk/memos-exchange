version: '3.8'

services:
  # Web Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      # 挂载数据库（数据持久化）
      - /home/hekai/.openclaw/workspace/memory-exchange.db:/app/data
    environment:
      - DATABASE_URL=/app/data/memory-exchange.db
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Frontend
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src/web-frontend:/usr/share/nginx/html:ro
      - ./src/web-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

networks:
  memory-network:
    driver: bridge
